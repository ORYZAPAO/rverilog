[package]
name = "rverilog-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rverilog"
path = "src/main.rs"

[dependencies]
rverilog-frontend = { path = "../frontend" }
rverilog-hir = { path = "../hir" }
rverilog-elab = { path = "../elab" }
rverilog-mir = { path = "../mir" }
rverilog-sim = { path = "../sim" }
rverilog-vcd = { path = "../vcd_out" }
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"

